name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Roda testes e o gate de evals com o simulador: sem segredo e sem custo.
      - run: mvn -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: target/eval-report.md
